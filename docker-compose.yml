services:
  mysql:
    image: mysql:8.4
    container_name: pulsedesk-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend

    container_name: pulsedesk-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_READ_TIMEOUT_SECONDS: ${DATABASE_READ_TIMEOUT_SECONDS:-60}
      DATABASE_WRITE_TIMEOUT_SECONDS: ${DATABASE_WRITE_TIMEOUT_SECONDS:-60}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PASSWORD_CHANGE_TOKEN_EXPIRE_MINUTES: ${PASSWORD_CHANGE_TOKEN_EXPIRE_MINUTES:-10}
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["http://localhost:4200","http://127.0.0.1:4200"]}'

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: pulsedesk-frontend
    restart: unless-stopped

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

volumes:
  mysql_data:
  frontend_node_modules:
