services:
  mysql:
    image: mysql:8.4
    container_name: pulsedesk-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: pulsedesk-mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"

    expose:
      - "1025"

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend

    container_name: pulsedesk-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_READ_TIMEOUT_SECONDS: ${DATABASE_READ_TIMEOUT_SECONDS:-60}
      DATABASE_WRITE_TIMEOUT_SECONDS: ${DATABASE_WRITE_TIMEOUT_SECONDS:-60}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PASSWORD_CHANGE_TOKEN_EXPIRE_MINUTES: ${PASSWORD_CHANGE_TOKEN_EXPIRE_MINUTES:-10}
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
      NOTIFICATION_CLEANUP_BATCH_SIZE: ${NOTIFICATION_CLEANUP_BATCH_SIZE:-1000}
      NOTIFICATION_CLEANUP_MAX_BATCHES: ${NOTIFICATION_CLEANUP_MAX_BATCHES:-100}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-30}
      EMAIL_FROM_ADDRESS: support@example.com
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-PulseDesk}
      EMAIL_REPLY_TO: support@example.com
      EMAIL_SUPPORT_NAME: ${EMAIL_SUPPORT_NAME:-PulseDesk Support}
      EMAIL_PRODUCT_NAME: ${EMAIL_PRODUCT_NAME:-PulseDesk}
      EMAIL_DELIVERY_BATCH_SIZE: ${EMAIL_DELIVERY_BATCH_SIZE:-50}
      EMAIL_PROCESSING_LEASE_MINUTES: ${EMAIL_PROCESSING_LEASE_MINUTES:-10}
      EMAIL_DELIVERY_POLL_INTERVAL_SECONDS: ${EMAIL_DELIVERY_POLL_INTERVAL_SECONDS:-5}
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["http://localhost:4200","http://127.0.0.1:4200"]}'

    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  customer-email-worker:
    build:
      context: ./backend

    container_name: pulsedesk-customer-email-worker
    restart: unless-stopped
    command: ["python", "-m", "app.cli.run_customer_email_worker"]

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_READ_TIMEOUT_SECONDS: ${DATABASE_READ_TIMEOUT_SECONDS:-60}
      DATABASE_WRITE_TIMEOUT_SECONDS: ${DATABASE_WRITE_TIMEOUT_SECONDS:-60}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PASSWORD_CHANGE_TOKEN_EXPIRE_MINUTES: ${PASSWORD_CHANGE_TOKEN_EXPIRE_MINUTES:-10}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-30}
      EMAIL_FROM_ADDRESS: support@example.com
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-PulseDesk}
      EMAIL_REPLY_TO: support@example.com
      EMAIL_SUPPORT_NAME: ${EMAIL_SUPPORT_NAME:-PulseDesk Support}
      EMAIL_PRODUCT_NAME: ${EMAIL_PRODUCT_NAME:-PulseDesk}
      EMAIL_DELIVERY_BATCH_SIZE: ${EMAIL_DELIVERY_BATCH_SIZE:-50}
      EMAIL_PROCESSING_LEASE_MINUTES: ${EMAIL_PROCESSING_LEASE_MINUTES:-10}
      EMAIL_DELIVERY_POLL_INTERVAL_SECONDS: ${EMAIL_DELIVERY_POLL_INTERVAL_SECONDS:-5}

    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: pulsedesk-frontend
    restart: unless-stopped

    ports:
      - "4200:4200"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

volumes:
  mysql_data:
  frontend_node_modules:
